name: generate animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  push:
    branches:
      - main   # change to "master" if that's your default branch name
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: FaizaEsha
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF3B30&color_dots=#3A0B10,#5A0F16,#7A1720,#FF3B30
            dist/github-snake.svg?color_snake=#5A0F16&color_dots=#0A0A0A,#3A0B10,#5A0F16,#7A1720

      - name: push github-snake svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
